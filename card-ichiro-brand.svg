<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="160" viewBox="0 0 1100 160">
  <defs>
    <linearGradient id="obsB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#05070A"/>
      <stop offset="100%" stop-color="#0E151E"/>
    </linearGradient>
    <filter id="glowB" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="14" y="14" width="1072" height="132" rx="24" ry="24" fill="url(#obsB)" stroke="#FFFFFF" stroke-opacity="0.88" stroke-width="2.2" filter="url(#glowB)"/>

  <!-- Soft pulse border hint -->
  <rect x="22" y="22" width="1056" height="116" rx="20" ry="20" fill="none" stroke="#FFFFFF" stroke-width="1">
    <animate attributeName="stroke-opacity" values="0.08;0.28;0.08" dur="3s" repeatCount="indefinite"/>
  </rect>

  <text x="550" y="75" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#E8EEF5" letter-spacing="3" filter="url(#glowB)">ICHIRO — LEGACY OF REBIRTH</text>
  <text x="550" y="105" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#8B95A3" letter-spacing="1">by Ethernium · R&amp;D Nemeth Corp</text>
</svg>
