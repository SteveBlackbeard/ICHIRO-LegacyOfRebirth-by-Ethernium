           V150
           Q1085,166 1070,166
           H30
           Q15,166 15,150
           V46
           Q15,30 30,30 Z"
        fill="url(#obsB)" stroke="#FFFFFF" stroke-opacity="0.92" stroke-width="2.3" filter="url(#glowB)"/>

  <text x="550" y="100" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#E8EEF5" letter-spacing="3" filter="url(#glowB)">ICHIRO — LEGACY OF REBIRTH</text>
  <text x="550" y="130" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#8B95A3" letter-spacing="1">by Ethernium · R&amp;D Nemeth Corp</text>
</svg>
