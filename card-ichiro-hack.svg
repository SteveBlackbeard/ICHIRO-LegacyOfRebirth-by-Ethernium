<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="380" viewBox="0 0 1100 380">
  <defs>
    <linearGradient id="obsH" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#04060A"/>
      <stop offset="100%" stop-color="#0B121A"/>
    </linearGradient>
    <filter id="glowH" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="2.8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7CFFB2" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#7CFFB2" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#7CFFB2" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <rect x="14" y="14" width="1072" height="352" rx="24" ry="24" fill="url(#obsH)" stroke="#FFFFFF" stroke-opacity="0.9" stroke-width="2.2" filter="url(#glowH)"/>
  <rect x="22" y="22" width="1056" height="336" rx="20" ry="20" fill="none" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="1"/>

  <!-- Scanline sweep -->
  <rect x="22" width="1056" height="28" fill="#FFFFFF" opacity="0.04">
    <animate attributeName="y" values="22;330;22" dur="3.8s" repeatCount="indefinite"/>
  </rect>

  <!-- Status pulse -->
  <circle cx="48" cy="52" r="5" fill="#7CFFB2" filter="url(#glowH)">
    <animate attributeName="opacity" values="1;0.25;1" dur="1.4s" repeatCount="indefinite"/>
  </circle>
  <text x="64" y="57" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#7CFFB2">LIVE · ARCHIVE DECRYPT</text>

  <text x="48" y="95" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#9AA5B2">root@ethernium:~# decrypt --target ICHIRO_LEGACY --mode cinematic</text>
  <text x="48" y="122" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#C8D0DA">> auth.token ................. <tspan fill="#7CFFB2">ACCEPTED</tspan></text>
  <text x="48" y="148" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#C8D0DA">> shard.index ................ <tspan fill="#7CFFB2">17/17 RECOVERED</tspan></text>
  <text x="48" y="174" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#C8D0DA">> dossier.stream ............. <tspan fill="#7CFFB2">SYNCHRONIZED</tspan></text>
  <text x="48" y="200" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#FF6B6B">> warning .................... temporal drift · sector Ω</text>
  <text x="48" y="226" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#C8D0DA">> portal.mesh ................ <tspan fill="#7CFFB2">ONLINE</tspan></text>
  <text x="48" y="252" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#C8D0DA">> vortex.gate ................ <tspan fill="#FFFFFF">ARMED</tspan></text>

  <!-- Progress bar -->
  <rect x="48" y="280" width="1004" height="8" rx="4" fill="#1A222C"/>
  <rect x="48" y="280" height="8" rx="4" fill="url(#bar)">
    <animate attributeName="width" values="120;1004;1004;120" dur="5s" repeatCount="indefinite"/>
  </rect>

  <text x="48" y="318" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#E8EEF5" letter-spacing="3">NEW EDEN // QUANTUM-VORTEX INTERFACE</text>
  <text x="48" y="342" font-family="Consolas, 'Courier New', monospace" font-size="11" fill="#6B7582">AAA CINEMATIC LAYER · PROTOCOL v1 · ETHERNIUM CORP</text>
</svg>
