<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="260" viewBox="0 0 1100 260">
  <defs>
    <linearGradient id="obsT" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#03050A"/>
      <stop offset="45%" stop-color="#0A111A"/>
      <stop offset="100%" stop-color="#05080F"/>
    </linearGradient>
    <linearGradient id="edgeT" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.15"/>
    </linearGradient>
    <filter id="glowT" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="2.8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="scanT" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Inward notches -->
  <path d="M28,32 H420 L445,52 H655 L680,32 H1072 Q1088,32 1088,48 V212 Q1088,228 1072,228 H680 L655,208 H445 L420,228 H28 Q12,228 12,212 V48 Q12,32 28,32 Z"
        fill="url(#obsT)" stroke="url(#edgeT)" stroke-width="2.4" filter="url(#glowT)"/>

  <path d="M40,44 H428 L448,60 H652 L672,44 H1060 Q1070,44 1070,54 V206 Q1070,216 1060,216 H672 L652,200 H448 L428,216 H40 Q30,216 30,206 V54 Q30,44 40,44 Z"
        fill="none" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="1"/>

  <!-- Corner ticks -->
  <path d="M48 56 H78 M48 56 V86" stroke="#FFFFFF" stroke-opacity="0.45" stroke-width="1.4" fill="none"/>
  <path d="M1052 56 H1022 M1052 56 V86" stroke="#FFFFFF" stroke-opacity="0.45" stroke-width="1.4" fill="none"/>
  <path d="M48 204 H78 M48 204 V174" stroke="#FFFFFF" stroke-opacity="0.45" stroke-width="1.4" fill="none"/>
  <path d="M1052 204 H1022 M1052 204 V174" stroke="#FFFFFF" stroke-opacity="0.45" stroke-width="1.4" fill="none"/>

  <rect x="40" width="1020" height="36" fill="url(#scanT)" opacity="0.9">
    <animate attributeName="y" values="50;190;50" dur="5s" repeatCount="indefinite"/>
  </rect>

  <text x="550" y="118" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="44" font-weight="700" fill="#F7F9FC" letter-spacing="10" filter="url(#glowT)">ICHIRO</text>
  <text x="550" y="155" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#C5CED8" letter-spacing="5">LEGACY OF REBIRTH</text>
  <text x="550" y="188" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="11" fill="#7B8694" letter-spacing="3">CINEMATIC INTERACTIVE ARCHIVE · ETHERNIUM</text>
</svg>
