<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1100" height="420" viewBox="0 0 1100 420">
  <defs>
    <linearGradient id="obs" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#05070A"/>
      <stop offset="50%" stop-color="#0A1018"/>
      <stop offset="100%" stop-color="#070B10"/>
    </linearGradient>
    <linearGradient id="neonStroke" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.25"/>
    </linearGradient>
    <filter id="glow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="2.8" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="round">
      <rect x="28" y="28" width="1044" height="320" rx="18" ry="18"/>
    </clipPath>
  </defs>

  <!-- Outer card -->
  <rect x="14" y="14" width="1072" height="392" rx="24" ry="24"
        fill="url(#obs)" stroke="url(#neonStroke)" stroke-width="2.5" filter="url(#glow)"/>

  <!-- Inner frame -->
  <rect x="22" y="22" width="1056" height="332" rx="20" ry="20"
        fill="none" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="1"/>

  <!-- Logo image -->
  <image
    xlink:href="ichiro-logo-title.png"
    x="28" y="28" width="1044" height="320"
    clip-path="url(#round)"
    preserveAspectRatio="xMidYMid meet"/>

  <!-- Bottom caption bar -->
  <rect x="14" y="360" width="1072" height="46" fill="#05070A" opacity="0.92"/>
  <text x="550" y="390" text-anchor="middle"
        font-family="Segoe UI, Helvetica, Arial, sans-serif"
        font-size="13" fill="#C8D0DA" letter-spacing="4">
    LEGACY OF REBIRTH · CINEMATIC ARCHIVE · BY ETHERNIUM
  </text>
</svg>
