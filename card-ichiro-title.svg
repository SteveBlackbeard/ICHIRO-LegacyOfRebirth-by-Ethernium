<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="480" viewBox="0 0 1100 480">
  <defs>
    <linearGradient id="obs" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#02040A"/>
      <stop offset="40%" stop-color="#0A121C"/>
      <stop offset="100%" stop-color="#050910"/>
    </linearGradient>
    <linearGradient id="edge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7EB6FF" stop-opacity="0.15"/>
      <stop offset="35%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="65%" stop-color="#B8F3FF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#7EB6FF" stop-opacity="0.15"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="logoClip">
      <rect x="80" y="50" width="940" height="280" rx="12"/>
    </clipPath>
  </defs>

  <!-- Panel + BOTTOM NOTCH OUTWARD -->
  <path d="M24,28
           H1076
           Q1092,28 1092,46
           V360
           Q1092,378 1076,378
           H710
           L675,458
           H425
           L390,378
           H24
           Q8,378 8,360
           V46
           Q8,28 24,28 Z"
        fill="url(#obs)" stroke="url(#edge)" stroke-width="2.6" filter="url(#glow)"/>

  <!-- Inner frame -->
  <path d="M40,46
           H1060
           Q1072,46 1072,58
           V348
           Q1072,360 1060,360
           H700
           L672,430
           H428
           L400,360
           H40
           Q28,360 28,348
           V58
           Q28,46 40,46 Z"
        fill="none" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="1.2"/>

  <!-- Corner brackets -->
  <path d="M52 62 H96 M52 62 V106" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="1.6" fill="none"/>
  <path d="M1048 62 H1004 M1048 62 V106" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="1.6" fill="none"/>
  <path d="M52 340 H96 M52 340 V296" stroke="#FFFFFF" stroke-opacity="0.45" stroke-width="1.6" fill="none"/>
  <path d="M1048 340 H1004 M1048 340 V296" stroke="#FFFFFF" stroke-opacity="0.45" stroke-width="1.6" fill="none"/>

  <!-- LOGO - CAMBIA ESTA URL POR LA TUYA -->
  <image href="https://raw.githubusercontent.com/SteveBlackbeard/ICHIRO-LegacyOfRebirth-by-Ethernium
/main/ichiro-logo-title.png"
         x="80" y="50" width="940" height="280"
         clip-path="url(#logoClip)"
         preserveAspectRatio="xMidYMid meet"/>

  <!-- Text inside frame -->
  <text x="550" y="370" text-anchor="middle"
        font-family="Segoe UI, Helvetica, Arial, sans-serif"
        font-size="14" fill="#D5DEE8" letter-spacing="4">
    CINEMATIC INTERACTIVE ARCHIVE · BY ETHERNIUM
  </text>
</svg>
