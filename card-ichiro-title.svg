<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="260" viewBox="0 0 1100 260">
  <defs>
    <linearGradient id="obsT" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#03050A"/>
      <stop offset="100%" stop-color="#0A111A"/>
    </linearGradient>
    <filter id="glowT" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Top flat · bottom notch OUTWARD -->
  <path d="M30,30
           H1070
           Q1085,30 1085,46
           V200
           Q1085,216 1070,216
           H700 L670,246 H430 L400,216 H30
           Q15,216 15,200
           V46
           Q15,30 30,30 Z"
        fill="url(#obsT)" stroke="#FFFFFF" stroke-opacity="0.92" stroke-width="2.3" filter="url(#glowT)"/>

  <text x="550" y="110" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="40" font-weight="700" fill="#F5F7FA" letter-spacing="8" filter="url(#glowT)">ICHIRO</text>
  <text x="550" y="150" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#C8D0DA" letter-spacing="4">LEGACY OF REBIRTH</text>
  <text x="550" y="180" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="11" fill="#7A8490" letter-spacing="2">CINEMATIC ARCHIVE · BY ETHERNIUM</text>
</svg>
