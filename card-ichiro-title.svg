<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="420" viewBox="0 0 1100 420">
  <defs>
    <linearGradient id="obs" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#02040A"/>
      <stop offset="40%" stop-color="#0A121C"/>
      <stop offset="100%" stop-color="#050910"/>
    </linearGradient>
    <linearGradient id="edge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7EB6FF" stop-opacity="0.15"/>
      <stop offset="35%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="65%" stop-color="#B8F3FF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#7EB6FF" stop-opacity="0.15"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Outer panel + BOTTOM NOTCH OUTWARD -->
  <path d="M24,28
           H1076
           Q1092,28 1092,46
           V340
           Q1092,358 1076,358
           H710
           L675,408
           H425
           L390,358
           H24
           Q8,358 8,340
           V46
           Q8,28 24,28 Z"
        fill="url(#obs)" stroke="url(#edge)" stroke-width="2.6" filter="url(#glow)"/>

  <!-- Inner frame -->
  <path d="M40,46
           H1060
           Q1072,46 1072,58
           V328
           Q1072,340 1060,340
           H700
           L672,380
           H428
           L400,340
           H40
           Q28,340 28,328
           V58
           Q28,46 40,46 Z"
        fill="none" stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="1.2"/>

  <!-- Corner brackets -->
  <path d="M52 62 H96 M52 62 V106" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="1.6" fill="none"/>
  <path d="M1048 62 H1004 M1048 62 V106" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="1.6" fill="none"/>
  <path d="M52 320 H96 M52 320 V276" stroke="#FFFFFF" stroke-opacity="0.45" stroke-width="1.6" fill="none"/>
  <path d="M1048 320 H1004 M1048 320 V276" stroke="#FFFFFF" stroke-opacity="0.45" stroke-width="1.6" fill="none"/>

  <!-- Side rails -->
  <path d="M20 110 V170 M20 200 V260" stroke="#7EB6FF" stroke-opacity="0.35" stroke-width="2"/>
  <path d="M1080 110 V170 M1080 200 V260" stroke="#7EB6FF" stroke-opacity="0.35" stroke-width="2"/>

  <!-- Title text INSIDE the frame -->
  <text x="550" y="175" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="64" font-weight="700" fill="#F7F9FC" letter-spacing="12" filter="url(#glow)">
    ICHIRO
  </text>

  <text x="550" y="225" text-anchor="middle"
        font-family="Segoe UI, Helvetica, Arial, sans-serif"
        font-size="18" fill="#C5CED8" letter-spacing="6">
    LEGACY OF REBIRTH
  </text>

  <text x="550" y="275" text-anchor="middle"
        font-family="Consolas, 'Courier New', monospace"
        font-size="13" fill="#7EB6FF" letter-spacing="3">
    CINEMATIC INTERACTIVE ARCHIVE · ETHERNIUM
  </text>
</svg>
