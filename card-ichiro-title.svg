<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     width="1100"
     height="520"
     viewBox="0 0 1100 520">

  <defs>

    <!-- Fondo -->
    <linearGradient id="obs" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#02040A"/>
      <stop offset="40%" stop-color="#0A121C"/>
      <stop offset="100%" stop-color="#050910"/>
    </linearGradient>

    <!-- Borde -->
    <linearGradient id="edge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7EB6FF" stop-opacity="0.15"/>
      <stop offset="35%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="65%" stop-color="#B8F3FF" stop-opacity="0.90"/>
      <stop offset="100%" stop-color="#7EB6FF" stop-opacity="0.15"/>
    </linearGradient>

    <!-- Título -->
    <linearGradient id="titleGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8BBEFF"/>
      <stop offset="35%" stop-color="#FFFFFF"/>
      <stop offset="65%" stop-color="#D7F6FF"/>
      <stop offset="100%" stop-color="#8BBEFF"/>
    </linearGradient>

    <!-- Óvalo degradado -->
    <radialGradient id="ambientBloom" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4D8EFF" stop-opacity="0.16"/>
      <stop offset="28%" stop-color="#3A7CFF" stop-opacity="0.10"/>
      <stop offset="58%" stop-color="#2865D8" stop-opacity="0.045"/>
      <stop offset="82%" stop-color="#1A4DA8" stop-opacity="0.012"/>
      <stop offset="100%" stop-color="#102C62" stop-opacity="0"/>
    </radialGradient>

    <!-- Reflejo -->
    <linearGradient id="sheen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="42%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="58%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- Haz horizontal -->
    <linearGradient id="horizontalBeam" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9FD9FF" stop-opacity="0"/>
      <stop offset="35%" stop-color="#9FD9FF" stop-opacity="0.03"/>
      <stop offset="48%" stop-color="#BFEAFF" stop-opacity="0.13"/>
      <stop offset="50%" stop-color="#E7F8FF" stop-opacity="0.24"/>
      <stop offset="52%" stop-color="#BFEAFF" stop-opacity="0.13"/>
      <stop offset="65%" stop-color="#9FD9FF" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#9FD9FF" stop-opacity="0"/>
    </linearGradient>

    <!-- Haz vertical SIN segunda línea -->
    <linearGradient id="verticalBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9FD9FF" stop-opacity="0"/>
      <stop offset="18%" stop-color="#9FD9FF" stop-opacity="0.012"/>
      <stop offset="36%" stop-color="#9FD9FF" stop-opacity="0.045"/>
      <stop offset="50%" stop-color="#BFEAFF" stop-opacity="0.13"/>
      <stop offset="64%" stop-color="#9FD9FF" stop-opacity="0.045"/>
      <stop offset="82%" stop-color="#9FD9FF" stop-opacity="0.012"/>
      <stop offset="100%" stop-color="#9FD9FF" stop-opacity="0"/>
    </linearGradient>

    <!-- Scanlines -->
    <pattern id="horizontalLines" width="8" height="8" patternUnits="userSpaceOnUse">
      <path d="M0 0.5 H8" stroke="#9FD9FF" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>

    <!-- Glows -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-30%" y="-50%" width="160%" height="200%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="titleGlow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="scannerGlow" x="-900%" y="-10%" width="1900%" height="120%">
      <feGaussianBlur stdDeviation="2.1" result="scannerBlur"/>
      <feMerge>
        <feMergeNode in="scannerBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Clip imagen -->
    <clipPath id="logoClip">
      <rect x="70" y="58" width="960" height="292" rx="14" ry="14"/>
    </clipPath>

    <!-- Clip exacto del marco interior con notch -->
    <clipPath id="panelClip">
      <path d="
        M40 46
        H1060
        Q1072 46 1072 58
        V418
        Q1072 430 1060 430
        H700
        L672 468
        H428
        L400 430
        H40
        Q28 430 28 418
        V58
        Q28 46 40 46
        Z"/>
    </clipPath>

  </defs>

  <!-- Panel exterior -->
  <path d="
    M24 28
    H1076
    Q1092 28 1092 46
    V430
    Q1092 448 1076 448
    H710
    L675 498
    H425
    L390 448
    H24
    Q8 448 8 430
    V46
    Q8 28 24 28
    Z"
    fill="url(#obs)"
    stroke="url(#edge)"
    stroke-width="2.6"
    filter="url(#glow)"/>

  <!-- Óvalo -->
  <ellipse cx="550"
           cy="216"
           rx="450"
           ry="145"
           fill="url(#ambientBloom)"
           filter="url(#softGlow)"/>

  <!-- Imagen -->
  <image href="ichiro-logo-title.png"
         xlink:href="ichiro-logo-title.png"
         x="70"
         y="58"
         width="960"
         height="292"
         preserveAspectRatio="xMidYMid meet"
         clip-path="url(#logoClip)"/>

  <!-- Reflejo -->
  <rect x="70"
        y="58"
        width="180"
        height="292"
        fill="url(#sheen)"
        clip-path="url(#logoClip)"
        pointer-events="none">
    <animate attributeName="x"
             values="70;850;70"
             dur="6s"
             repeatCount="indefinite"/>
  </rect>

  <!-- Escáneres -->
  <g clip-path="url(#panelClip)" pointer-events="none">

    <!-- Trama horizontal -->
    <rect x="28"
          y="46"
          width="1044"
          height="422"
          fill="url(#horizontalLines)"/>

    <!-- Escáner horizontal -->
    <g>
      <rect x="28"
            y="-32"
            width="1044"
            height="64"
            fill="url(#horizontalBeam)"
            opacity="0.90"/>

      <line x1="28"
            y1="0"
            x2="1072"
            y2="0"
            stroke="#E7F8FF"
            stroke-width="1.3"
            stroke-opacity="0.68"/>

      <animateTransform attributeName="transform"
                        type="translate"
                        values="0 46;0 468;0 46"
                        dur="4.8s"
                        repeatCount="indefinite"/>
    </g>

    <!-- Escáner vertical corregido -->
    <g>
      <!-- halo -->
      <rect x="-26"
            y="46"
            width="52"
            height="422"
            fill="url(#verticalBeam)"
            opacity="0.82"/>

      <!-- única línea vertical continua -->
      <rect x="-0.8"
            y="46"
            width="1.6"
            height="422"
            fill="#E7F8FF"
            fill-opacity="0.78"
            filter="url(#scannerGlow)"/>

      <animateTransform attributeName="transform"
                        type="translate"
                        values="28 0;1072 0;28 0"
                        dur="6.4s"
                        repeatCount="indefinite"/>
    </g>

  </g>

  <!-- Título -->
  <text x="550"
        y="276"
        text-anchor="middle"
        font-family="Segoe UI, Helvetica, Arial, sans-serif"
        font-size="184"
        font-weight="800"
        letter-spacing="8"
        fill="url(#titleGradient)"
        stroke="#FFFFFF"
        stroke-opacity="0.20"
        stroke-width="1"
        paint-order="stroke"
        filter="url(#titleGlow)">
    ICHIRO
  </text>

  <!-- Textos inferiores -->
  <text x="550"
        y="378"
        text-anchor="middle"
        font-family="Segoe UI, Helvetica, Arial, sans-serif"
        font-size="20"
        font-weight="700"
        fill="#D5DEE8"
        letter-spacing="5">
    LEGACY OF REBIRTH
  </text>

  <text x="550"
        y="408"
        text-anchor="middle"
        font-family="Consolas, 'Courier New', monospace"
        font-size="15"
        font-weight="500"
        fill="#8A9AAD"
        letter-spacing="2.5">
    CINEMATIC INTERACTIVE ARCHIVE · BY ETHERNIUM
  </text>

  <!-- Marco interior -->
  <path d="
    M40 46
    H1060
    Q1072 46 1072 58
    V418
    Q1072 430 1060 430
    H700
    L672 468
    H428
    L400 430
    H40
    Q28 430 28 418
    V58
    Q28 46 40 46
    Z"
    fill="none"
    stroke="#FFFFFF"
    stroke-opacity="0.18"
    stroke-width="1.2"
    pointer-events="none"/>

  <!-- Esquinas -->
  <path d="M52 62 H96 M52 62 V106"
        stroke="#FFFFFF"
        stroke-opacity="0.55"
        stroke-width="1.6"
        fill="none"/>

  <path d="M1048 62 H1004 M1048 62 V106"
        stroke="#FFFFFF"
        stroke-opacity="0.55"
        stroke-width="1.6"
        fill="none"/>

  <path d="M52 410 H96 M52 410 V366"
        stroke="#FFFFFF"
        stroke-opacity="0.45"
        stroke-width="1.6"
        fill="none"/>

  <path d="M1048 410 H1004 M1048 410 V366"
        stroke="#FFFFFF"
        stroke-opacity="0.45"
        stroke-width="1.6"
        fill="none"/>

  <!-- Marcas laterales -->
  <path d="M20 120 V180 M20 220 V280"
        stroke="#7EB6FF"
        stroke-opacity="0.35"
        stroke-width="2"/>

  <path d="M1080 120 V180 M1080 220 V280"
        stroke="#7EB6FF"
        stroke-opacity="0.35"
        stroke-width="2"/>

  <!-- Barra superior -->
  <text x="70"
        y="48"
        font-family="Consolas, 'Courier New', monospace"
        font-size="10"
        fill="#7EB6FF"
        opacity="0.85">
    ICH-01 · ARCHIVE HEADER · SECURE
  </text>

  <text x="1030"
        y="48"
        text-anchor="end"
        font-family="Consolas, 'Courier New', monospace"
        font-size="10"
        fill="#7EB6FF"
        opacity="0.85">
    Ω SIGNAL
  </text>

</svg>
