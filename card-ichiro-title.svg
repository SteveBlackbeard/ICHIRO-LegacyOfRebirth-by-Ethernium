<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1100" height="440" viewBox="0 0 1100 440">
  <defs>
    <linearGradient id="obsT" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#05070A"/>
      <stop offset="50%" stop-color="#0A1018"/>
      <stop offset="100%" stop-color="#070B10"/>
    </linearGradient>
    <filter id="glowT" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- Outer notched frame path -->
    <clipPath id="clipT">
      <path d="M40,28
               H420 L440,12 H660 L680,28 H1060
               Q1080,28 1080,48
               V360
               Q1080,380 1060,380
               H680 L660,396 H440 L420,380 H40
               Q20,380 20,360
               V48
               Q20,28 40,28 Z"/>
    </clipPath>
  </defs>

  <!-- Fill -->
  <path d="M40,28
           H420 L440,12 H660 L680,28 H1060
           Q1080,28 1080,48
           V360
           Q1080,380 1060,380
           H680 L660,396 H440 L420,380 H40
           Q20,380 20,360
           V48
           Q20,28 40,28 Z"
        fill="url(#obsT)" stroke="#FFFFFF" stroke-opacity="0.9" stroke-width="2.2" filter="url(#glowT)"/>

  <!-- Inner hairline -->
  <path d="M48,40
           H424 L444,24 H656 L676,40 H1052
           Q1064,40 1064,52
           V352
           Q1064,364 1052,364
           H676 L656,380 H444 L424,364 H48
           Q36,364 36,352
           V52
           Q36,40 48,40 Z"
        fill="none" stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="1"/>

  <!-- Logo -->
  <image xlink:href="ichiro-logo-title.png"
         x="60" y="50" width="980" height="290"
         clip-path="url(#clipT)"
         preserveAspectRatio="xMidYMid meet"/>

  <!-- Caption -->
  <text x="550" y="420" text-anchor="middle"
        font-family="Segoe UI, Helvetica, Arial, sans-serif"
        font-size="12" fill="#A8B2BE" letter-spacing="3">
    LEGACY OF REBIRTH · CINEMATIC ARCHIVE · BY ETHERNIUM
  </text>
</svg>
