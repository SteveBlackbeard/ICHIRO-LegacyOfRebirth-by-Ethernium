name: Validate static experience

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          lfs: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Audit production dependencies
        run: npm run audit:dependencies
      - run: npm test
      - name: Upload asset governance report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: kpr-v253-asset-governance
          path: .artifacts/assets
          if-no-files-found: warn
          retention-days: 14
      - name: Upload final asset readiness report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: kpr-v264-final-asset-readiness
          path: .artifacts/assets/final-asset-readiness-v264.json
          if-no-files-found: warn
          retention-days: 30
      - name: Upload runtime ownership report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: kpr-v254-runtime-ownership
          path: .artifacts/runtime
          if-no-files-found: warn
          retention-days: 14
      - name: Upload visual cohesion report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: kpr-v255-visual-cohesion
          path: .artifacts/visual
          if-no-files-found: warn
          retention-days: 14
      - name: Upload dossier protocol report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: kpr-v256-dossier-contracts
          path: .artifacts/dossiers
          if-no-files-found: warn
          retention-days: 14
      - name: Upload accessibility report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: kpr-v257-accessibility
          path: .artifacts/accessibility
          if-no-files-found: warn
          retention-days: 14
      - name: Upload secure delivery evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: kpr-v258-secure-delivery
          path: .artifacts/delivery
          if-no-files-found: warn
          retention-days: 30
      - name: Upload observability contract
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: kpr-v259-local-observability
          path: .artifacts/observability
          if-no-files-found: warn
          retention-days: 30
      - name: Upload Gold candidate evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: kpr-v260-gold-candidate
          path: .artifacts/gold
          if-no-files-found: warn
          retention-days: 90

  browser-proof:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run Chromium golden path
        run: npm run test:e2e
        env:
          KPR_E2E_BROWSER_PATH: /usr/bin/google-chrome
      - name: Upload browser proof
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: kpr-v252-browser-proof
          path: .artifacts/e2e
          if-no-files-found: warn
          retention-days: 14

  browser-device-matrix:
    needs: validate
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run Chrome and Edge Gold journeys
        run: npm run test:e2e:matrix
      - name: Upload browser and device matrix
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: kpr-v263-browser-device-matrix
          path: .artifacts/browser-matrix
          if-no-files-found: warn
          retention-days: 30

  weekly-soak:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run repeated Chromium journey
        run: npm run test:soak
        env:
          KPR_E2E_BROWSER_PATH: /usr/bin/google-chrome
          KPR_SOAK_CYCLES: 2
      - name: Upload soak evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: kpr-v259-weekly-soak
          path: .artifacts/soak
          if-no-files-found: warn
          retention-days: 30

  deploy-pages:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: [validate, browser-proof, browser-device-matrix]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:static
      - name: Prove the packaged site in Chromium
        run: npm run test:e2e:static
        env:
          KPR_E2E_BROWSER_PATH: /usr/bin/google-chrome
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .artifacts/site
      - name: Upload packaged-site browser proof
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: kpr-v261-static-browser-proof
          path: .artifacts/e2e-static
          if-no-files-found: warn
          retention-days: 30
      - name: Deploy approved static distribution
        id: deployment
        uses: actions/deploy-pages@v5
