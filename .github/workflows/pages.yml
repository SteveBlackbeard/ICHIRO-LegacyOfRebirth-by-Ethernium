name: Validate static experience

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Upload asset governance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kpr-v253-asset-governance
          path: .artifacts/assets
          if-no-files-found: warn
          retention-days: 14
      - name: Upload runtime ownership report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kpr-v254-runtime-ownership
          path: .artifacts/runtime
          if-no-files-found: warn
          retention-days: 14

  browser-proof:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run Chromium golden path
        run: npm run test:e2e
        env:
          KPR_E2E_BROWSER_PATH: /usr/bin/google-chrome
      - name: Upload browser proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kpr-v252-browser-proof
          path: .artifacts/e2e
          if-no-files-found: warn
          retention-days: 14
