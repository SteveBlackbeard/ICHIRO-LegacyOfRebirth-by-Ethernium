  <line x1="180" y1="125" x2="270" y2="125" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="1"/>
  <line x1="390" y1="125" x2="490" y2="125" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="1"/>
  <line x1="610" y1="125" x2="710" y2="125" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="1"/>
  <line x1="830" y1="125" x2="920" y2="125" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="1"/>

  <text x="550" y="220" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#C8D0DA">Identity was broken. The archive remembers.</text>
  <text x="550" y="250" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="11" fill="#6B7582">ADAPTIVE OPTICS · DOSSIER PROGRESSION · CINEMATIC LAYER</text>
