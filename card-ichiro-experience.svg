<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="340" viewBox="0 0 1100 340">
  <defs>
    <linearGradient id="obsE" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#03050A"/>
      <stop offset="100%" stop-color="#0D1520"/>
    </linearGradient>
    <filter id="glowE" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Top & bottom notches OUTWARD -->
  <path d="M30,40
           H400 L430,14 H670 L700,40 H1070
           Q1085,40 1085,56
           V284
           Q1085,300 1070,300
           H700 L670,326 H430 L400,300 H30
           Q15,300 15,284
           V56
           Q15,40 30,40 Z"
        fill="url(#obsE)" stroke="#FFFFFF" stroke-opacity="0.92" stroke-width="2.3" filter="url(#glowE)"/>

  <text x="550" y="78" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#9AA5B2" letter-spacing="4">EXPERIENCE FLOW</text>

  <path d="M140 130 H960" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="1" stroke-dasharray="5 7">
    <animate attributeName="stroke-dashoffset" values="0;-24" dur="1.1s" repeatCount="indefinite"/>
  </path>

  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <circle cx="140" cy="130" r="7" fill="#FFFFFF"><animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/></circle>
    <text x="140" y="165" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">ACTIVATION</text>
    <text x="140" y="185" text-anchor="middle" font-size="11" fill="#8B95A3">enter archive</text>

    <circle cx="340" cy="130" r="7" fill="#FFFFFF"><animate attributeName="opacity" values="0.4;1;0.4" dur="2s" begin="0.25s" repeatCount="indefinite"/></circle>
    <text x="340" y="165" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">DOSSIERS</text>
    <text x="340" y="185" text-anchor="middle" font-size="11" fill="#8B95A3">records</text>

    <circle cx="550" cy="130" r="7" fill="#FFFFFF"><animate attributeName="opacity" values="0.4;1;0.4" dur="2s" begin="0.5s" repeatCount="indefinite"/></circle>
    <text x="550" y="165" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">ARTIFACTS</text>
    <text x="550" y="185" text-anchor="middle" font-size="11" fill="#8B95A3">3D remnants</text>

    <circle cx="760" cy="130" r="7" fill="#FFFFFF"><animate attributeName="opacity" values="0.4;1;0.4" dur="2s" begin="0.75s" repeatCount="indefinite"/></circle>
    <text x="760" y="165" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">PORTALS</text>
    <text x="760" y="185" text-anchor="middle" font-size="11" fill="#8B95A3">WebGL</text>

    <circle cx="960" cy="130" r="7" fill="#7CFFB2" filter="url(#glowE)"><animate attributeName="opacity" values="0.5;1;0.5" dur="2s" begin="1s" repeatCount="indefinite"/></circle>
    <text x="960" y="165" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">VORTEX</text>
    <text x="960" y="185" text-anchor="middle" font-size="11" fill="#8B95A3">New Eden</text>
  </g>

  <text x="550" y="240" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#C8D0DA">Identity was broken. The archive remembers.</text>
  <text x="550" y="265" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="11" fill="#66707D">ADAPTIVE OPTICS · DOSSIER PROGRESSION · CINEMATIC LAYER</text>
</svg>
