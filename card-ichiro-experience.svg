<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="300" viewBox="0 0 1100 300">
  <defs>
    <linearGradient id="obsE" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07090C"/>
      <stop offset="100%" stop-color="#10151C"/>
    </linearGradient>
    <filter id="neonE" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="16" y="16" width="1068" height="268" rx="22" ry="22" fill="url(#obsE)" stroke="#FFFFFF" stroke-opacity="0.85" stroke-width="2" filter="url(#neonE)"/>
  <rect x="24" y="24" width="1052" height="252" rx="18" ry="18" fill="none" stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="1"/>

  <text x="550" y="58" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#9AA5B2" letter-spacing="3">EXPERIENCE FLOW</text>

  <text x="120" y="120" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">ACTIVATION</text>
  <text x="120" y="145" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#8B95A3">enter archive</text>

  <text x="330" y="120" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">DOSSIERS</text>
  <text x="330" y="145" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#8B95A3">recovered records</text>

  <text x="550" y="120" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">ARTIFACTS</text>
  <text x="550" y="145" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#8B95A3">3D remnants</text>

  <text x="770" y="120" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">PORTALS</text>
  <text x="770" y="145" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#8B95A3">WebGL transit</text>

  <text x="980" y="120" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">VORTEX</text>
