  <text x="48" y="175" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#8B95A3">npm run check · npm run test:vortex</text>
  <text x="48" y="210" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#6B7582">Node.js 22.12+ · landscape on mobile · adaptive GPU tier</text>
</svg>
