<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="260" viewBox="0 0 1100 260">
  <defs>
    <linearGradient id="obsR" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07090C"/>
      <stop offset="100%" stop-color="#10151C"/>
    </linearGradient>
    <filter id="neonR" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="16" y="16" width="1068" height="228" rx="22" ry="22" fill="url(#obsR)" stroke="#FFFFFF" stroke-opacity="0.85" stroke-width="2" filter="url(#neonR)"/>
  <rect x="24" y="24" width="1052" height="212" rx="18" ry="18" fill="none" stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="1"/>

  <text x="48" y="60" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#9AA5B2" letter-spacing="2">RUN THE ARCHIVE</text>
