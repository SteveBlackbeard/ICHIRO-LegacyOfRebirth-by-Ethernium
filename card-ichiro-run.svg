<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="310" viewBox="0 0 1100 310">
  <defs>
    <linearGradient id="obsE" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#03050A"/>
      <stop offset="100%" stop-color="#0D1520"/>
    </linearGradient>
    <filter id="glowE" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <path d="M28,32 H410 L435,52 H665 L690,32 H1072 Q1088,32 1088,48 V262 Q1088,278 1072,278 H690 L665,258 H435 L410,278 H28 Q12,278 12,262 V48 Q12,32 28,32 Z"
        fill="url(#obsE)" stroke="#FFFFFF" stroke-opacity="0.92" stroke-width="2.4" filter="url(#glowE)"/>

  <text x="550" y="60" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#9AA5B2" letter-spacing="4">EXPERIENCE FLOW</text>

  <path d="M130 118 H970" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="1" stroke-dasharray="5 7">
    <animate attributeName="stroke-dashoffset" values="0;-24" dur="1.1s" repeatCount="indefinite"/>
  </path>

  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <circle cx="120" cy="118" r="8" fill="#FFFFFF"><animate attributeName="opacity" values="0.35;1;0.35" dur="2s" repeatCount="indefinite"/></circle>
    <text x="120" y="152" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">ACTIVATION</text>
    <text x="120" y="172" text-anchor="middle" font-size="11" fill="#8B95A3">enter archive</text>

    <circle cx="330" cy="118" r="8" fill="#FFFFFF"><animate attributeName="opacity" values="0.35;1;0.35" dur="2s" begin="0.25s" repeatCount="indefinite"/></circle>
    <text x="330" y="152" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">DOSSIERS</text>
    <text x="330" y="172" text-anchor="middle" font-size="11" fill="#8B95A3">recovered records</text>

    <circle cx="550" cy="118" r="8" fill="#FFFFFF"><animate attributeName="opacity" values="0.35;1;0.35" dur="2s" begin="0.5s" repeatCount="indefinite"/></circle>
    <text x="550" y="152" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">ARTIFACTS</text>
    <text x="550" y="172" text-anchor="middle" font-size="11" fill="#8B95A3">3D remnants</text>

    <circle cx="770" cy="118" r="8" fill="#FFFFFF"><animate attributeName="opacity" values="0.35;1;0.35" dur="2s" begin="0.75s" repeatCount="indefinite"/></circle>
    <text x="770" y="152" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">PORTALS</text>
    <text x="770" y="172" text-anchor="middle" font-size="11" fill="#8B95A3">WebGL transit</text>

    <circle cx="980" cy="118" r="8" fill="#7CFFB2" filter="url(#glowE)"><animate attributeName="opacity" values="0.45;1;0.45" dur="2s" begin="1s" repeatCount="indefinite"/></circle>
    <text x="980" y="152" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">VORTEX</text>
    <text x="980" y="172" text-anchor="middle" font-size="11" fill="#8B95A3">New Eden gate</text>
