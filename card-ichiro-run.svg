  <text x="550" y="230" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#C8D0DA">Identity was broken. The archive remembers.</text>
  <text x="550" y="255" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="11" fill="#66707D">ADAPTIVE OPTICS · DOSSIER PROGRESSION · CINEMATIC LAYER</text>
