      <stop offset="0%" stop-color="#03050A"/>
      <stop offset="100%" stop-color="#0D1520"/>
    </linearGradient>
    <filter id="glowR" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
