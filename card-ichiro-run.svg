<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="270" viewBox="0 0 1100 270">
  <defs>
    <linearGradient id="obsR" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#05070A"/>
      <stop offset="100%" stop-color="#0E151E"/>
    </linearGradient>
    <filter id="glowR" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="14" y="14" width="1072" height="242" rx="24" ry="24" fill="url(#obsR)" stroke="#FFFFFF" stroke-opacity="0.9" stroke-width="2.2" filter="url(#glowR)"/>
  <rect x="22" y="22" width="1056" height="226" rx="20" ry="20" fill="none" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="1"/>

  <text x="48" y="58" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#9AA5B2" letter-spacing="3">RUN THE ARCHIVE</text>

  <text x="48" y="100" font-family="Consolas, 'Courier New', monospace" font-size="17" fill="#7CFFB2" filter="url(#glowR)">npm install &amp;&amp; npm start</text>
  <text x="48" y="138" font-family="Consolas, 'Courier New', monospace" font-size="16" fill="#E8EEF5">http://127.0.0.1:8000/</text>
  <text x="48" y="175" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#8B95A3">npm run check · npm run test:vortex</text>

  <!-- Cursor blink -->
  <rect x="48" y="200" width="10" height="16" fill="#FFFFFF">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>
  <text x="66" y="213" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#6B7582">Node.js 22.12+ · landscape on mobile · adaptive GPU tier</text>
</svg>
